<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Build Tracker</title>
  <meta name="description" content="Track construction expenses for your new home.">
  <meta name="theme-color" content="#1F6B4F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <!-- iPhone home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Build">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="sidenav" aria-label="Main">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="32" height="32">
        <span>Home Build</span>
      </div>
      <a class="btn primary side-add" href="#/add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add expense
      </a>
      <nav class="side-links">
        <a href="#/" data-nav="/">Overview</a>
        <a href="#/expenses" data-nav="/expenses">Expenses</a>
        <a href="#/budget" data-nav="/budget">Budget &amp; stages</a>
        <a href="#/vendors" data-nav="/vendors">Vendors</a>
        <a href="#/settings" data-nav="/settings">Settings</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <a id="back" class="icon-btn back" href="#/" aria-label="Back" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <div class="title-wrap">
          <div id="eyebrow" class="eyebrow" hidden></div>
          <h1 id="title">Home Build</h1>
        </div>
        <button id="sync-pill" type="button" class="pill"></button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Main">
      <a href="#/" data-nav="/">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"/></svg><span>Home</span></a>
      <a href="#/expenses" data-nav="/expenses">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Expenses</span></a>
      <a href="#/add" class="fab" aria-label="Add expense">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
      <a href="#/vendors" data-nav="/vendors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 20c1-4 4-6 7-6s6 2 7 6M17 11a3 3 0 1 0 0-6M22 20c-.5-2.5-2-4-4-4.5"/></svg><span>Vendors</span></a>
      <a href="#/settings" data-nav="/settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="chart-tip" class="chart-tip" hidden></div>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Bill" hidden></div>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
